[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-oidc-provider"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pyjwt>=2.8",
    "cryptography>=42",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-flask>=1.3",
    "coverage[toml]>=7",
]

[project.scripts]
mock-oidc = "mock_oidc.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mock_oidc*"]

[tool.setuptools.package-data]
mock_oidc = ["templates/*.html"]

[tool.coverage.run]
source = ["mock_oidc"]
omit = ["mock_oidc/__main__.py"]

[tool.coverage.report]
fail_under = 85
